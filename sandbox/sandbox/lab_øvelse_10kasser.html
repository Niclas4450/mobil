<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Lab øvelse 10 kasser</title>
    <link rel="stylesheet" href="css/lab_øvelse_10kasser.css" />
  </head>
  <body>
    <div><img src="img/sunset.jpeg" alt="blur" /></div>
    <grid class="grid_1">
      <div><img class="img1" src="img/sunset.jpeg" alt="blur" /></div>
      <figcaption>blur</figcaption>
      <div><img class="img2" src="img/sunset.jpeg" alt="saturate" /></div>
      <figcaption>saturate</figcaption>
      <div><img class="img3" src="img/sunset.jpeg" alt="brightness" /></div>
      <figcaption>brightness</figcaption>
      <div><img class="img4" src="img/sunset.jpeg" alt="contrast" /></div>
      <figcaption>contrast</figcaption>
      <div><img class="img5" src="img/sunset.jpeg" alt="grayscale" /></div>
      <figcaption>grayscale</figcaption>
      <div><img class="img6" src="img/sunset.jpeg" alt="hue-rotate" /></div>
      <figcaption>hue-rotate</figcaption>
      <div><img class="img7" src="img/sunset.jpeg" alt="invert" /></div>
      <figcaption>invert</figcaption>
      <div><img class="img8" src="img/sunset.jpeg" alt="opacity" /></div>
      <figcaption>opacity</figcaption>
      <div><img class="img9" src="img/sunset.jpeg" alt="sepia" /></div>
      <figcaption>sepia</figcaption>
      <div><img class="img10" src="img/sunset.jpeg" alt="drop-shadow" /></div>
      <figcaption>drop-shadow</figcaption>
    </grid>
  </body>
</html>
